name: Bootstrap Pulpit Ultimate

on:
  push:
    branches:
      - upgrade/ultimate

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/ultimate
          fetch-depth: 0
      - name: Rebuild verified project
        shell: bash
        run: |
          cat .bootstrap/part-* > /tmp/pulpit-ultimate.b64
          base64 -d /tmp/pulpit-ultimate.b64 > /tmp/pulpit-ultimate.tgz
          set +e
          gzip -dc /tmp/pulpit-ultimate.tgz > /tmp/pulpit-ultimate.tar
          GZIP_STATUS=$?
          set -e
          echo "gzip status: ${GZIP_STATUS}"
          tar -tf /tmp/pulpit-ultimate.tar > /tmp/archive-files.txt
          tar -xf /tmp/pulpit-ultimate.tar
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          test -s index.html
          test -s src/app.js
          test -s LICENSE
          test -s .github/workflows/ci.yml
      - name: Verify project
        shell: bash
        run: |
          npm test
          npm run check
      - name: Commit Ultimate upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Pulpit Ultimate 2.0"
          git push origin HEAD:upgrade/ultimate
