name: CI

on:
  push:
    branches:
      - main
      - 'upgrade/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
